[project]
name = "gr-autopilot"
version = "0.1.0"
description = "Autonomous automation suite for a Goodreads account"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
voice = [
    "chromadb>=0.5",
    "sentence-transformers>=3",
]
generate = [
    "anthropic>=0.40",
]
browser = [
    "playwright>=1.48",
    "playwright-stealth>=2.0",
]

[project.scripts]
gr = "gr_autopilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml,sarif]>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gr_autopilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/gr_autopilot/catalog/goodreads_public.py" = ["S310"]  # fixed-host public read

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "chromadb.*",
    "anthropic.*",
    "playwright.*",
    "playwright_stealth.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=gr_autopilot --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
# Thin adapters over optional heavy deps (torch via sentence-transformers,
# chromadb); exercised by integration tests when the `voice` extra is
# installed, not in the unit-test CI run.
omit = [
    "src/gr_autopilot/voice/embedder.py",
    "src/gr_autopilot/voice/chroma_store.py",
    "src/gr_autopilot/generate/anthropic_client.py",
    "src/gr_autopilot/actions/playwright_backend.py",
    "src/gr_autopilot/browser/session.py",
    "src/gr_autopilot/orchestrator/pipeline.py",
    "src/gr_autopilot/catalog/goodreads_public.py",
    "src/gr_autopilot/actions/graphql_backend.py",
]

[tool.coverage.report]
exclude_also = [
    "\\.\\.\\.",
    "if TYPE_CHECKING:",
]
